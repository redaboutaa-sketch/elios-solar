name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elios
          POSTGRES_PASSWORD: elios_ci
          POSTGRES_DB: elios_solar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elios -d elios_solar_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://elios:elios_ci@127.0.0.1:5432/elios_solar_test?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-0123456789
      BETTER_AUTH_URL: http://127.0.0.1:3400
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3400
      NEXT_PUBLIC_BRAND_NAME: ELIOS SOLAR
      SITE_INDEXABLE: "false"
      PAYMENT_PROVIDER: demo
      DEMO_PAYMENT_WEBHOOK_SECRET: ci-demo-webhook-secret
      MAIL_PROVIDER: log
      ADMIN_NOTIFICATION_EMAIL: admin@example.invalid
      MEDIA_STORAGE_DIR: ./uploads
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec next typegen
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - name: Tests navigateur (Playwright)
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            tests/e2e/screenshots
          retention-days: 14
